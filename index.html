<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#103f34" />
  <meta name="description" content="Talentera Huddle — Retention performance, renewal operations and financial intelligence." />
  <title>Talentera Huddle · Retention Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f2f5f3}
    #dashboard{display:block;width:100%;height:100%;border:0;background:#f2f5f3}
  </style>
</head>
<body>
  <iframe id="dashboard" src="./legacy.html" title="Talentera Retention Command Center"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('dashboard');
      const logo = 'https://talimg1.b8cdn.com/wp-content/themes/talentera-2018/images/new-design/Talentera-ATS-white-logo.svg';

      function balanceDashboardLayout(doc) {
        const panel = doc.querySelector('#panel-dashboard');
        if (!panel || panel.querySelector('.dashboard-balanced-flow')) return;

        const directChildren = Array.from(panel.children);
        const tierGrid = directChildren.find(element => element.matches('.grid2') && element.querySelector('#tierDistributionCards'));
        const renewalGrid = directChildren.find(element => element.matches('.grid2') && element.querySelector('#renewalPipelineList'));
        if (!tierGrid || !renewalGrid) return;

        const tierCard = tierGrid.children[0];
        const smartActionsCard = tierGrid.children[1];
        const renewalCard = renewalGrid.children[0];
        const delayedCard = renewalGrid.children[1];
        if (!tierCard || !smartActionsCard || !renewalCard || !delayedCard) return;

        const layout = doc.createElement('div');
        layout.className = 'dashboard-balanced-flow';

        const leftColumn = doc.createElement('div');
        leftColumn.className = 'dashboard-balanced-column';
        leftColumn.append(tierCard, renewalCard);

        const rightColumn = doc.createElement('div');
        rightColumn.className = 'dashboard-balanced-column';
        rightColumn.append(smartActionsCard, delayedCard);

        layout.append(leftColumn, rightColumn);
        tierGrid.replaceWith(layout);
        renewalGrid.remove();

        Array.from(panel.querySelectorAll(':scope > .section-gap')).forEach(gap => {
          if (gap.nextElementSibling?.classList.contains('section-gap')) gap.remove();
        });
      }

      function appendStylesheet(doc, id, href) {
        if (doc.getElementById(id)) return;
        const link = doc.createElement('link');
        link.id = id;
        link.rel = 'stylesheet';
        link.href = href;
        doc.head.appendChild(link);
      }

      function appendScript(doc, id, src) {
        return new Promise((resolve, reject) => {
          const existing = doc.getElementById(id);
          if (existing) {
            resolve();
            return;
          }
          const script = doc.createElement('script');
          script.id = id;
          script.src = src;
          script.async = false;
          script.onload = resolve;
          script.onerror = reject;
          doc.body.appendChild(script);
        });
      }

      function enhance() {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;

          doc.documentElement.classList.add('huddle-retention');
          doc.body.classList.add('huddle-retention-body');
          doc.title = 'Talentera Huddle · Retention Command Center';

          appendStylesheet(doc, 'huddle-retention-theme', './huddle-retention-theme.css?v=20260624-3');
          appendStylesheet(doc, 'retention-policy-style', './retention-policy.css?v=20260624-1');
          balanceDashboardLayout(doc);

          const brand = doc.querySelector('.brand');
          if (brand && brand.dataset.huddleEnhanced !== '1') {
            brand.dataset.huddleEnhanced = '1';
            brand.innerHTML = `<img src="${logo}" alt="Talentera" /><small>Talentera Huddle · Retention</small>`;
          }

          const live = doc.querySelector('.live');
          if (live) live.innerHTML = '<i></i> Live · Sheets + HubSpot';

          appendScript(doc, 'retention-policy-core', './retention-policy-core.js?v=20260624-1')
            .then(() => appendScript(doc, 'retention-policy-ui', './retention-policy-ui.js?v=20260624-1'))
            .catch(error => console.error('Retention source policy failed to load:', error));

          const top = doc.querySelector('.top');
          const sidebar = doc.querySelector('.sidebar');
          if (top && sidebar && !doc.getElementById('mobileMenuButton')) {
            const menu = doc.createElement('button');
            menu.id = 'mobileMenuButton';
            menu.className = 'icon-btn mobile-menu';
            menu.type = 'button';
            menu.setAttribute('aria-label', 'Open navigation');
            menu.textContent = '☰';
            top.prepend(menu);

            const overlay = doc.createElement('button');
            overlay.id = 'mobileNavOverlay';
            overlay.className = 'mobile-nav-overlay';
            overlay.type = 'button';
            overlay.setAttribute('aria-label', 'Close navigation');
            doc.body.appendChild(overlay);

            const closeMenu = () => {
              sidebar.classList.remove('open');
              overlay.classList.remove('open');
            };

            menu.addEventListener('click', () => {
              sidebar.classList.add('open');
              overlay.classList.add('open');
            });
            overlay.addEventListener('click', closeMenu);
            sidebar.addEventListener('click', event => {
              if (event.target.closest('.nav-btn') && matchMedia('(max-width: 900px)').matches) closeMenu();
            });
          }

          if (!doc.documentElement.dataset.huddleShortcuts) {
            doc.documentElement.dataset.huddleShortcuts = '1';
            doc.addEventListener('keydown', event => {
              if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'f') {
                event.preventDefault();
                doc.getElementById('searchInput')?.focus();
              }
              if (event.key === 'Escape') {
                doc.querySelector('.sidebar')?.classList.remove('open');
                doc.getElementById('mobileNavOverlay')?.classList.remove('open');
              }
            });
          }
        } catch (error) {
          console.error('Retention theme enhancement failed:', error);
        }
      }

      frame.addEventListener('load', enhance);
    })();
  </script>
</body>
</html>
