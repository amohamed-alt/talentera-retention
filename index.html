<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#103f34" />
  <meta name="description" content="Talentera Huddle — Retention performance, renewal operations and financial intelligence." />
  <title>Talentera Huddle · Retention Command Center</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f2f5f3}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #dashboard{display:block;width:100%;height:100%;border:0;background:#f2f5f3;opacity:0;transition:opacity .18s ease}
    #dashboard.ready{opacity:1}
    .boot{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#f2f5f3;color:#53635b}
    .boot-card{min-width:250px;padding:28px 34px;border:1px solid #e4ebe7;border-radius:16px;background:#fff;box-shadow:0 8px 25px rgba(31,58,45,.055);text-align:center}
    .spinner{width:34px;height:34px;margin:0 auto 14px;border:3px solid #dce9e2;border-top-color:#0b6e43;border-radius:50%;animation:spin .8s linear infinite}
    .boot b{display:block;color:#1b2821;font-size:13px}.boot small{display:block;margin-top:5px;font-size:10px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot" id="boot"><div class="boot-card"><div class="spinner"></div><b>Loading Talentera Huddle</b><small>Retention command center</small></div></div>
  <iframe id="dashboard" src="./legacy.html" title="Talentera Retention Command Center"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('dashboard');
      const boot = document.getElementById('boot');
      const logo = 'https://talimg1.b8cdn.com/wp-content/themes/talentera-2018/images/new-design/Talentera-ATS-white-logo.svg';

      function showDashboard() {
        frame.classList.add('ready');
        boot.style.display = 'none';
      }

      function enhance() {
        try {
          const doc = frame.contentDocument;
          if (!doc) return showDashboard();

          doc.documentElement.classList.add('huddle-retention');
          doc.body.classList.add('huddle-retention-body');
          doc.title = 'Talentera Huddle · Retention Command Center';

          let theme = doc.getElementById('huddle-retention-theme');
          if (!theme) {
            theme = doc.createElement('link');
            theme.id = 'huddle-retention-theme';
            theme.rel = 'stylesheet';
            theme.href = './huddle-retention-theme.css?v=20260624';
            theme.onload = showDashboard;
            theme.onerror = showDashboard;
            doc.head.appendChild(theme);
          } else {
            showDashboard();
          }

          const brand = doc.querySelector('.brand');
          if (brand && brand.dataset.huddleEnhanced !== '1') {
            brand.dataset.huddleEnhanced = '1';
            brand.innerHTML = `<img src="${logo}" alt="Talentera" /><small>Talentera Huddle · Retention</small>`;
          }

          const live = doc.querySelector('.live');
          if (live) live.innerHTML = '<i></i> Live · Sheets';

          const top = doc.querySelector('.top');
          const sidebar = doc.querySelector('.sidebar');
          if (top && sidebar && !doc.getElementById('mobileMenuButton')) {
            const menu = doc.createElement('button');
            menu.id = 'mobileMenuButton';
            menu.className = 'icon-btn mobile-menu';
            menu.type = 'button';
            menu.setAttribute('aria-label', 'Open navigation');
            menu.textContent = '☰';
            top.prepend(menu);

            const overlay = doc.createElement('button');
            overlay.id = 'mobileNavOverlay';
            overlay.className = 'mobile-nav-overlay';
            overlay.type = 'button';
            overlay.setAttribute('aria-label', 'Close navigation');
            doc.body.appendChild(overlay);

            const closeMenu = () => {
              sidebar.classList.remove('open');
              overlay.classList.remove('open');
            };
            menu.addEventListener('click', () => {
              sidebar.classList.add('open');
              overlay.classList.add('open');
            });
            overlay.addEventListener('click', closeMenu);
            sidebar.addEventListener('click', event => {
              if (event.target.closest('.nav-btn') && matchMedia('(max-width: 900px)').matches) closeMenu();
            });
          }

          if (!doc.documentElement.dataset.huddleShortcuts) {
            doc.documentElement.dataset.huddleShortcuts = '1';
            doc.addEventListener('keydown', event => {
              if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'f') {
                event.preventDefault();
                doc.getElementById('searchInput')?.focus();
              }
              if (event.key === 'Escape') {
                doc.querySelector('.sidebar')?.classList.remove('open');
                doc.getElementById('mobileNavOverlay')?.classList.remove('open');
              }
            });
          }

          setTimeout(showDashboard, 1200);
        } catch (error) {
          console.error('Retention theme enhancement failed:', error);
          showDashboard();
        }
      }

      frame.addEventListener('load', enhance);
      setTimeout(showDashboard, 5000);
    })();
  </script>
</body>
</html>
